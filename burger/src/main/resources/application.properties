spring.application.name=projeto integrador

# ---------------------------------------------------------------------------
# Banco de dados (MySQL) - preencher antes de rodar a aplicacao com persistencia real
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/code_ink}
spring.datasource.username=${DB_USERNAME:code_ink_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------------------------------------------------------------------------
# JWT - a chave real deve existir somente na variavel de ambiente JWT_SECRET.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
